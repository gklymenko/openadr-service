# Database
db.address=${DB_ADDRESS}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Internal services
data.service.inner.domain=${DATA_SERVICE_INNER_DOMAIN}

# Certification Test Harness VTN
openadr.vtn.url=${OPENADR_VTN_URL}
openadr.vtn.id=${OPENADR_VTN_ID:}
openadr.ven.id=${OPENADR_VEN_ID}
openadr.ven.name=${OPENADR_VEN_NAME:QCharge EV Management VEN}

# Eonti ECC identity and truststore are materialized by GitLab CI/CD, mounted
# read-only, and loaded by the Spring Boot `openadr` SSL bundle.
spring.ssl.bundle.jks.openadr.keystore.location=file:/run/secrets/openadr/ven-identity.p12
spring.ssl.bundle.jks.openadr.keystore.password=${OPENADR_VEN_PRIMARY_IDENTITY_PASSWORD}
spring.ssl.bundle.jks.openadr.key.password=${OPENADR_VEN_PRIMARY_IDENTITY_PASSWORD}
spring.ssl.bundle.jks.openadr.key.alias=${OPENADR_VEN_PRIMARY_IDENTITY_ALIAS:openadr-ven}
spring.ssl.bundle.jks.openadr.truststore.location=file:/run/secrets/openadr/truststore.p12
spring.ssl.bundle.jks.openadr.truststore.password=${OPENADR_TRUSTSTORE_PASSWORD}
# Certification User Guide requires this for the Test Harness certificate.
openadr.security.disable-hostname-verification=true

# Logging
logging.level.com.qcharge.openadr=DEBUG
logging.level.org.springframework.web.client=DEBUG

# Flyway placeholder
aws.s3.static.url=${AWS_S3_STATIC_URL:}

db.address=127.0.0.1:3306
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/openadr_service?createDatabaseIfNotExist=true&serverTimezone=UTC

#Additional
data.service.inner.domain=https://dev.qchargeapp.com

# OpenADR VTN (test VTN Alliance)
openadr.vtn.url=https://vtn.oadr.com/OpenADR2/Simple/2.0b
openadr.vtn.id=test-vtn-001
openadr.ven.id=TH_VEN
openadr.ven.name=QCharge EV Management VEN

# Real OpenADR Alliance TEST certificates
openadr.security.keystore-path=classpath:certs/test/keystore.p12
openadr.security.keystore-password=openadr-ven-test
openadr.security.truststore-path=classpath:certs/test/truststore.p12
openadr.security.truststore-password=openadr-trust-prod

# Poll interval
openadr.transport.poll-interval-seconds=10

# Logging
logging.level.com.qcharge.openadr=DEBUG
logging.level.org.springframework.web.client=DEBUG

# AWS
aws.s3.static.url=http://localhost

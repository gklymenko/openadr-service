#DB
db.address=127.0.0.1:3306
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/openadr_service?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=test
spring.datasource.password=test

#Additional
data.service.inner.domain=http://localhost:8099

#Logging
logging.level.com.qcharge.log=TRACE
logging.level.org.apache.kafka.clients.producer.ProducerConfig=warn
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=warn
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=warn
logging.level.org.apache.kafka.clients.NetworkClient=error

# Local OpenADR Test Harness
openadr.ven.id=${OPENADR_VEN_ID:TH_VEN}
openadr.ven.name=${OPENADR_VEN_NAME:QCharge EV Management VEN}

# Test Harness switches its HTTP listener to TLS when HTTP_SHA256_Security is enabled.
openadr.vtn.url=${OPENADR_VTN_URL:https://127.0.0.1:8080}
openadr.vtn.id=${OPENADR_VTN_ID:TH_VTN}

# Local Eonti test certificates. The PKCS#12 files are read from the working tree and
# are deliberately excluded from packaged JARs and Docker images.
openadr.security.keystore-path=file:./src/main/resources/eonti_test_certs/ven-identity-certification.p12
openadr.security.keystore-password=${OPENADR_VEN_PRIMARY_IDENTITY_PASSWORD}
openadr.security.truststore-path=file:./src/main/resources/eonti_test_certs/truststore-certification.p12
openadr.security.truststore-password=${OPENADR_TRUSTSTORE_PASSWORD}
# Required only because the Test Harness server certificate uses CN/SAN=vtn.
openadr.security.disable-hostname-verification=true

# Poll interval
openadr.transport.poll-interval-seconds=10

# MarketContext
openadr.event.allowed-market-contexts=http://MarketContext1,http://MarketContext2

# ResourceId
openadr.report.resource-id=resource1

# Logging
logging.level.com.qcharge.openadr=TRACE
logging.level.org.springframework.web.client=DEBUG

# AWS
aws.s3.static.url=http://localhost

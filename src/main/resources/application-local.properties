#DB
db.address=127.0.0.1:3306
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/openadr_service?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=test
spring.datasource.password=test

#Additional
data.service.inner.domain=http://localhost:8099

#Logging
logging.level.com.qcharge.log=TRACE
logging.level.org.apache.kafka.clients.producer.ProducerConfig=warn
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=warn
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=warn
logging.level.org.apache.kafka.clients.NetworkClient=error

# VEN identity
openadr.ven.id=TH_VEN
openadr.ven.name=QCharge EV Management VEN

# VTN connection
## VTN = Test Harness
openadr.vtn.url=http://localhost:8080
openadr.vtn.id=TH_VTN

# keystore
## Test certificates were taken from https://www.eonti.com/openadrtestcertificates
openadr.security.keystore-path=classpath:certs/keystore.p12
openadr.security.keystore-password=openadr-ven
openadr.security.truststore-path=classpath:certs/truststore.p12
openadr.security.truststore-password=openadr-trust

# Poll interval
openadr.transport.poll-interval-seconds=10

# MarketContext
openadr.event.allowed-market-contexts=http://MarketContext1,http://MarketContext2

# ResourceId
openadr.report.resource-id=resource1

# Logging
logging.level.com.qcharge.openadr=TRACE
logging.level.org.springframework.web.client=DEBUG

# AWS
aws.s3.static.url=http://localhost
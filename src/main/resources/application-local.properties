#DB
db.address=127.0.0.1:3306
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/openadr_service?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=test
spring.datasource.password=test

aws.s3.static.url=http://localhost

#Additional
data.service.inner.domain=http://localhost:8099

#Logging
logging.level.com.qcharge.log=TRACE
logging.level.org.apache.kafka.clients.producer.ProducerConfig=warn
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=warn
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=warn
logging.level.org.apache.kafka.clients.NetworkClient=error

# OpenADR
# OpenLEADR mock VTN (python -m openleadr run --vtn)
openadr.vtn.url=http://localhost:8080/OpenADR2/Simple/2.0b
openadr.vtn.id=local-vtn

# keystore
openadr.keystore.password=openadr-ven
openadr.truststore.password=openadr-trust

openadr.transport.poll-interval-seconds=5
logging.level.com.qcharge.openadr=TRACE
logging.level.org.springframework.web.client=DEBUG
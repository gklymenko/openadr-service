# DB
db.address=${DB_ADDRESS}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Additional
data.service.inner.domain=https://qchargeapp.com

#  OpenADR VTN
openadr.vtn.url=${OPENADR_VTN_URL}
openadr.vtn.id=${OPENADR_VTN_ID}
openadr.ven.id=${OPENADR_VEN_ID}
openadr.ven.name=${OPENADR_VEN_NAME}

#  TLS certificates (with secrets/vault)
openadr.security.keystore-path=${OPENADR_KEYSTORE_PATH}
openadr.security.keystore-password=${OPENADR_KEYSTORE_PASSWORD}
openadr.security.truststore-path=${OPENADR_TRUSTSTORE_PATH}
openadr.security.truststore-password=${OPENADR_TRUSTSTORE_PASSWORD}

# Poll interval
openadr.transport.poll-interval-seconds=10

# Logging
logging.level.com.qcharge.openadr=INFO
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.security=WARN

# AWS
aws.s3.static.url=${AWS_S3_STATIC_URL}
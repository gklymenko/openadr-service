# DB
db.address=${DB_ADDRESS}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Internal services
data.service.inner.domain=${DATA_SERVICE_INNER_DOMAIN:https://qchargeapp.com}

# OpenADR production VTN
openadr.vtn.url=${OPENADR_VTN_URL}
openadr.vtn.id=${OPENADR_VTN_ID:}
openadr.ven.id=${OPENADR_VEN_ID}
openadr.ven.name=${OPENADR_VEN_NAME:QCharge EV Management VEN}

# Production PKCS#12 files are materialized by GitLab CI/CD and mounted read-only.
openadr.security.keystore-path=file:/run/secrets/openadr/ven-identity.p12
openadr.security.keystore-password=${OPENADR_VEN_PRIMARY_IDENTITY_PASSWORD}
openadr.security.keystore-alias=${OPENADR_VEN_PRIMARY_IDENTITY_ALIAS:openadr-ven}
openadr.security.truststore-path=file:/run/secrets/openadr/truststore.p12
openadr.security.truststore-password=${OPENADR_TRUSTSTORE_PASSWORD}
openadr.security.disable-hostname-verification=false

# Poll interval
openadr.transport.poll-interval-seconds=10

# Logging
logging.level.com.qcharge.openadr=INFO
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.security=WARN

# AWS
aws.s3.static.url=${AWS_S3_STATIC_URL:}

spring.application.name=openadr-service
server.port=8081
spring.main.allow-bean-definition-overriding=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

additional.microservices.data.service.name=qchargeopenadr

# Shared key for internal QCharge service-to-service endpoints.
# A blank value denies every internal request.
charge.key=${CHARGE_KEY:}

#Mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${db.address}/openadr_service?createDatabaseIfNotExist=true&serverTimezone=UTC

#Jpa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Hikari
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

#Flyway
spring.flyway.locations=classpath:/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.table=schema_version
spring.flyway.out-of-order=false
spring.flyway.placeholders.text-datatype=TEXT
spring.flyway.placeholders.aws.s3.static.url=${aws.s3.static.url}

#Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.authentication=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.ws=WARN
logging.level.org.springframework.web.socket.config.WebSocketMessageBrokerStats=WARN

# OpenADR VEN Configuration
openadr.ven.profile=2.0b
openadr.ven.query-registration-on-startup=false

# Pull mode polling interval
openadr.transport.poll-interval-seconds=10
openadr.transport.connect-timeout-seconds=5
openadr.transport.read-timeout-seconds=30
openadr.transport.retry-max-attempts=3
openadr.transport.retry-initial-delay-millis=1000
openadr.transport.retry-max-delay-millis=60000

# Empty means accept any marketContext
# openadr.event.allowed-market-contexts=http://marketcontext1,http://marketcontext2
openadr.event.allow-untargeted-events=true
openadr.event.scheduler-delay-millis=1000

# TLS / mTLS certificate locations and passwords are environment-specific.
# Rule 67 and PICS: this VEN declares only the ECC OpenADR security mechanism.
spring.ssl.bundle.jks.openadr.protocol=TLSv1.2
spring.ssl.bundle.jks.openadr.options.enabled-protocols=TLSv1.2
spring.ssl.bundle.jks.openadr.options.ciphers=TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
spring.ssl.bundle.jks.openadr.keystore.type=PKCS12
spring.ssl.bundle.jks.openadr.truststore.type=PKCS12
openadr.security.cert-expiry-warn-days=30
openadr.security.cert-expiry-critical-days=7

# Report telemetry (EV charger metrics to VTN)
openadr.report.resource-id=ev-chargers-group-1
openadr.report.telemetry-interval-seconds=60
openadr.report.delivery-lease-seconds=120

# Logging
logging.level.com.qcharge.openadr=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG
